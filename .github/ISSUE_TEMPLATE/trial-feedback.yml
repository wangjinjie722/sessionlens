name: Trial feedback
description: Tell us whether SessionLens found a useful problem or a false positive.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying SessionLens. A brief description is enough. Do not upload private session logs, credentials, or unreviewed reports. Synthetic examples are welcome.
  - type: input
    id: version
    attributes:
      label: SessionLens version and operating system
      placeholder: "0.1.1, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Session source
      options:
        - Codex
        - Claude Code
        - Both
        - Synthetic demo only
    validations:
      required: true
  - type: dropdown
    id: discovery
    attributes:
      label: Did automatic discovery find your sessions?
      options:
        - Yes
        - Some sessions were missing
        - No
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: Which finding was useful or incorrect?
      description: Describe the behavior and rule category in your own words. No full transcript is needed.
      placeholder: "The unchanged-retry finding helped, but a deliberately failing test was counted as a tool failure."
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Did you change anything after reading the advice?
      description: It is useful to know if the advice was unclear, unnecessary, or worth trying. Do not claim an improvement unless you tested it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked that this issue contains no credentials or private session content.
          required: true
