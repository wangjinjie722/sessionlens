[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionlens-cli"
version = "0.1.1"
description = "Evidence-linked diagnostics for local Codex and Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SessionLens contributors"}]
keywords = ["agents", "sessions", "evaluation", "codex", "claude"]
classifiers = ["Environment :: Console", "Operating System :: OS Independent", "Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Repository = "https://github.com/wangjinjie722/sessionlens"
Issues = "https://github.com/wangjinjie722/sessionlens/issues"

[project.scripts]
sessionlens = "sessionlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sessionlens = ["demo.jsonl"]
